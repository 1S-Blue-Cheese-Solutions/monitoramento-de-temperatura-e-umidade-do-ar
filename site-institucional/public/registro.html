
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/LogoBlueCheese.png" type="image/x-icon">
    <title>Registro - Blue Cheese</title>

</head>

<body>
    <main class="main-login">
        <header class="site-header">
            <div class="container nav">
                <a href="index.html#home" class="brand" aria-label="Blue Cheese - início">
                    <img src="./assets/LogoBlueCheese.png" alt="Logo Blue Cheese">
                </a>

                <nav class="nav-links" id="nav_links" aria-label="Navegação principal">
                    <a href="index.html#home">Home</a>
                    <a href="index.html#sobre">Sobre</a>
                    <a href="index.html#como-funciona">Como funciona</a>
                    <a href="index.html#simulador">Simulador financeiro</a>
                    <a href="index.html#quem-somos">Quem somos</a>
                </nav>

                <a class="nav-cta" href="login.html">Monitoramento →</a>
            </div>
        </header>

        <div class="login-overlay">
            <section class="login-card registro-card">
                <div class="login-intro">
                    <img src="assets/LogoBlueCheese.png" alt="Logo Blue Cheese">
                    <h1>Cadastre a sua empresa!</h1>
                    <p>Preencha os dados ao lado para começar a monitorar a maturação dos seus queijos.</p>
                </div>

                <div class="login-panel">
                    <a href="index.html" class="login-fechar">X</a>

                    <form class="login-form" autocomplete="on" novalidate onsubmit="registrar(); return false;">

                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="iempresa">Nome da empresa</label>
                                <div class="login-field">
                                    <input type="text" id="iempresa" placeholder="Queijaria Azul" maxlength="50">
                                </div>
                                <div class="login-msg" id="div_result_empresa"></div>
                            </div>

                            <div class="registro-campo">
                                <label for="icnpj">CNPJ</label>
                                <div class="login-field">
                                    <input type="text" id="icnpj" placeholder="Somente números" maxlength="14">
                                </div>
                                <div class="login-msg" id="div_result_cnpj"></div>
                            </div>
                        </div>

                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="icliente">Nome do cliente</label>
                                <div class="login-field">
                                    <input type="text" id="icliente" placeholder="Seu nome" maxlength="50">
                                </div>
                                <div class="login-msg" id="div_result_cliente"></div>
                            </div>

                            <div class="registro-campo">
                                <label for="icpf">CPF</label>
                                <div class="login-field">
                                    <input type="text" id="icpf" placeholder="Somente números" maxlength="11">
                                </div>
                                <div class="login-msg" id="div_result_cpf"></div>
                            </div>
                        </div>

                        <div class="registro-linha">
                            <div class="registro-campo">
                                <label for="imail">Email</label>
                                <div class="login-field">
                                    <input type="email" id="imail" placeholder="voce@queijaria.com" maxlength="40">
                                </div>
                                <div class="login-msg" id="div_result_mail"></div>
                            </div>

                            <div class="registro-campo">
                                <label for="icelular">Celular</label>
                                <div class="login-field">
                                    <input type="tel" id="icelular" placeholder="11999999999" maxlength="11">
                                </div>
                                <div class="login-msg" id="div_result_celular"></div>
                            </div>
                        </div>

                        <label for="isenha">Senha</label>
                        <div class="login-field">
                            <img class="lock-icon" src="assets/lockicon.svg" alt="">
                            <input type="password" id="isenha" placeholder="••••••••" maxlength="30">
                            <button type="button" class="login-ver" id="btn_ver1" onclick="verSenha1()">VER</button>
                        </div>
                        <div class="login-msg" id="div_result_senha"></div>

                        <label for="iconfirmacao">Confirmação de senha</label>
                        <div class="login-field">
                            <img class="lock-icon" src="assets/lockicon.svg" alt="">
                            <input type="password" id="iconfirmacao" placeholder="••••••••" maxlength="30">
                            <button type="button" class="login-ver" id="btn_ver2" onclick="verSenha2()">VER</button>
                        </div>
                        <div class="login-msg" id="div_result_confirmacao_senha"></div>

                        <button type="submit" class="login-entrar" id="btn_registrar">Registrar</button>
                    </form>

                    <p class="login-registro">
                        Já possui conta? <a href="login.html">Entrar</a>
                    </p>
                </div>
            </section>
        </div>
    </main>

    <div id="popup"
         class="bc-popup-overlay"
         role="alertdialog"
         aria-modal="true"
         aria-hidden="true"
         aria-labelledby="popupTitulo"
         aria-describedby="mensagemPopup">

        <div id="popupCard" class="bc-popup-card">
            <h2 id="popupTitulo">Atenção</h2>
            <p id="mensagemPopup"></p>
            <button type="button" onclick="fecharPopup()">Fechar</button>
        </div>
    </div>

    <script src="./js/registro.js"></script>
</body>
</html>
