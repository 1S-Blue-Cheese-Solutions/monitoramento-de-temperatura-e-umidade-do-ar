<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visão Geral | Blue Cheese</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="shortcut icon" href="./assets/LogoBlueCheese.png" type="image/x-icon">
</head>
<body class="dashboard-page" onload="validarSessao()">

  <!-- Menu lateral -->
  <div class="dashboard-sidebar">
    <a class="sidebar-brand" href="./index.html">
      <img src="./assets/LogoBlueCheese.png" alt="Blue Cheese">
    </a>

    <div class="sidebar-nav">
      <a href="./dashboard-geral.html" class="active">Visão Geral</a>
      <a href="./dashboard.html">Dashboard</a>
      <a href="./meus-locais.html">Meus Locais</a>
      <a href="./acessos.html">Usuários</a>
    </div>

    <div class="sidebar-account">
      <div class="sidebar-user">
    <span class="sidebar-avatar" id="avatar_usuario"></span>
    <span id="nome_usuario"></span>
      </div>
      <a href="./index.html" onclick="limparSessao()">Sair</a>
    </div>
  </div>

  <div class="dashboard">

    <div class="dashboard-header geral-header">
      <div class="dashboard-title">
        <h1>Visão Geral das Câmaras</h1>
        <span class="geral-local">Laticínios Serra Azul · Rua das Acácias, 120 · Serro - MG</span>
      </div>
      <div class="dashboard-controls">
        <!-- simulação: dá para escolher, mas a tela não muda -->
        <label>Empresa
          <select id="select_empresa" autocomplete="off">
            <option value="1">Laticínios Serra Azul</option>
            <option value="2">Queijaria Veia Azul</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Cards -->
    <div class="dashboard-cards geral-cards">
      <div class="dashboard-card">
        <span class="dashboard-card-label">DENTRO DA FAIXA IDEAL AGORA</span>
        <span class="card-valor" id="span_valor_dentro"></span>
        <div id="div_selo_dentro"></div>
      </div>
      <div class="dashboard-card">
        <span class="dashboard-card-label">TEMPO FORA DA FAIXA IDEAL HOJE</span>
        <span class="card-valor" id="span_valor_tempo"></span>
        <div id="div_selo_tempo"></div>
      </div>
      <div class="dashboard-card">
        <span class="dashboard-card-label">SENSORES ENVIANDO DADOS</span>
        <span class="card-valor" id="span_valor_sensores"></span>
        <div id="div_selo_sensores"></div>
      </div>
    </div>

    <!-- Tabela de câmaras -->
    <div class="dashboard-panel geral-painel">
      <table class="geral-tabela">
        <thead>
          <tr>
            <th>Câmara</th>
            <th>Temperatura</th>
            <th>Umidade</th>
            <th>Situação</th> 
            <th>Fora da faixa hoje</th>
            <th>Última leitura</th>
            <th aria-label="Ações"></th>
          </tr>
        </thead>
        <tbody id="tbody_camaras"></tbody>
      </table>
    </div>

  </div>

  <script src="./js/dashboard-geral.js"></script>
  <script src="./js/sessao.js"></script>
</body>
</html>
