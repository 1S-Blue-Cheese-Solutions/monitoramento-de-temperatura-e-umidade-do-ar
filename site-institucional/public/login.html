<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/LogoBlueCheese.png" type="image/x-icon">
    <title>Login - Blue Cheese</title>
</head>
<body>
    <main class="main-login">
        <header class="site-header">
            <div class="container nav">
            <a href="index.html#home" class="brand" aria-label="Blue Cheese - início">
                <img src="./assets/LogoBlueCheese.png" alt="Logo Blue Cheese">
            </a>
            <nav class="nav-links" id="nav_links" aria-label="Navegação principal">
                <a href="index.html#home">Home</a>
                <a href="index.html#sobre">Sobre</a>
                <a href="index.html#como-funciona">Como funciona</a>
                <a href="index.html#simulador">Simulador financeiro</a>
                <a href="index.html#quem-somos">Quem somos</a>
            </nav>
            <a class="nav-cta" href="login.html">Monitoramento →</a>
            </div>
        </header>
        <div class="login-overlay">
            <section class="login-card">
                <div class="login-intro">
                    <img src="assets/LogoBlueCheese.png">
                    <h1>O monitoramento que sua empresa precisa!</h1>
                    <p>Monitoramento em tempo real para uma maturação mais segura, precisa e eficiente dos seus queijos.</p>
                </div>
                <div class="login-panel">
                    <a href="index.html" class="login-fechar">X</a>
                    <form class="login-form" autocomplete="on">
                        <label for="imail">E-mail</label>
                        <div class="login-field">
                            <img class="mail-icon" src="assets/mailicon.svg">
                            <input type="email" name="mail" id="imail" placeholder="voce@queijaria.com" autocomplete="email" required maxlength="40">
                        </div>
                        <div class="login-msg" id="div_result_mail"></div>

                        <label for="isenha">Senha</label>
                        <div class="login-field">
                            <img class="lock-icon" src="assets/lockicon.svg">
                            <input type="password" name="senha" id="isenha" placeholder="••••••••" required minlength="8" maxlength="30">
                            <button type="button" class="login-ver" id="btn_ver" onclick="verSenha()">VER</button>
                        </div>
                        <div class="login-msg" id="div_result_senha"></div>

                        <button type="button" class="login-entrar" id="btn_entrar" onclick="entrar()">Entrar</button>
                        <!-- <a href="#" class="login-esqueci">Esqueci minha senha</a> -->
                    </form>
                    <p class="login-registro">Não possui conta? <a href="registro.html">Registrar-se</a></p>
                </div>
            </section>
        </div>
    </main>

    <div id="popup"
        class="bc-popup-overlay"
        role="alertdialog"
        aria-modal="true"
        aria-hidden="true"
        aria-labelledby="popupTitulo"
        aria-describedby="mensagemPopup">

        <div id="popupCard" class="bc-popup-card">
            <h2 id="popupTitulo">Atenção</h2>
            <p id="mensagemPopup"></p>
            <button type="button" onclick="fecharPopup()">Fechar</button>
        </div>
    </div>

    <script src="./js/login.js"></script>
    <script src="./js/sessao.js"></script>
</body>
</html>
