<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador financeiro
    </title>
</head>
<body>
    <section class="section" id="simulador">
      <div class="container">
        <div class="eyebrow">Simulador Financeiro</div>
        <h2 class="section-title" style="font-size:34px;">Calculadora de queijo perdido</h2>
    <span>
      Informe a quantidade de queijo perdida e o tipo para calcular o prejuízo
      financeiro.
    </span>
    <br />
    <br>

    <label>Quantos quilos de queijo foram perdidos?</label><br />
    <input type="text" id="input_quilos" /><br />
    <br>
    <label>Qual o tipo de queijo?</label><br />
    <select id="select_queijo">
      <option value="0" selected disabled>Selecione uma opção</option>
      <option value="400">Roquefort (R$400,00 / kg)</option>
      <option value="120">Gorgonzola (R$120,00 / kg)</option>
    </select>
    <br />
    <br />
    <button onclick="queijoPerdido()">Calcular Prejuízo</button><br /><br />
    <div id="div_resultado"></div>
    <br />
    <br />
    <h2 class="section-title" style="font-size:34px;">Calculadora de sensores</h2>
    <br>
    <span> Escolha qual pacote de sensores você deseja </span>
    <select id="select_pacote">
      <option selected disabled>Insira uma opção</option>
      <option value="1">Pacote 10 sensores</option>
      <option value="2">Pacote 20 sensores</option>
      <option value="3">Pacote 30 sensores</option>
    </select>
    <br />
    <br>
    <button onclick="escolher()">Escolher</button> <br />

    <div id="div_exbCalc"></div>
      </div>
    <br>
    <br>

    <h2 class="section-title" style="font-size:34px;">Calculadora de investimento x retorno</h2>
      
    </section>
</body>
</html>
<script>
    function queijoPerdido() {
  let quilos = Number(input_quilos.value);
  let precoPorKg = Number(select_queijo.value);
  let nomeQueijo = select_queijo.options[select_queijo.selectedIndex].text;

  let prejuizoTotal = quilos * precoPorKg;

  div_resultado.innerHTML = `
            <div>
                Tipo de queijo: ${nomeQueijo}<br>
                Quantidade perdida: ${quilos.toFixed(2)}kg<br>
                Prejuízo total: R$ ${prejuizoTotal.toFixed(2)}
            </div>
        `;        
}

    function escolher() {
  let pacote = select_pacote.value;
  let unidSensor = 11;

  if (pacote == "1") {
    let pacote10 = unidSensor * 10;
    let pacote10Format = pacote10.toFixed(2);

    div_exbCalc.innerHTML = `Você optou pelo sistema com 10 sensores, seu gasto com sensores será de R$${pacote10Format}`;
  }
  if (pacote == "2") {
    let pacote20 = unidSensor * 20;
    let pacote20Format = pacote20.toFixed(2);

    div_exbCalc.innerHTML = `Você optou pelo sistema com 20 sensores, seu gasto com sensores será de R$${pacote20Format}`;
  }
  if (pacote == "3") {
    let pacote30 = unidSensor * 30;
    let pacote30Format = pacote30.toFixed(2);

    div_exbCalc.innerHTML = `Você optou pelo sistema com 30 sensores, seu gasto com sensores será de R$${pacote30Format}`;
  }
}
</script>
